name: One-time Telegram Help Voice Import

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/import-telegram-help-voice-once.yml"

permissions:
  contents: write

concurrency:
  group: telegram-help-voice-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Install audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check gdown

      - name: Download the public Drive OGG
        run: |
          set -euo pipefail
          gdown --fuzzy "https://drive.google.com/file/d/1T5seafoB-RB3AKebibhDQx1CA_VqAb7s/view?usp=drivesdk" -O /tmp/help-source.ogg
          test -s /tmp/help-source.ogg
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,duration -of default=noprint_wrappers=1 /tmp/help-source.ogg

      - name: Convert to Telegram OGG Opus voice format
        run: |
          set -euo pipefail
          mkdir -p assets
          ffmpeg -hide_banner -loglevel error -y \
            -i /tmp/help-source.ogg -map 0:a:0 -vn \
            -ac 1 -ar 48000 -c:a libopus -b:a 16k -vbr on \
            -application voip -frame_duration 20 -f ogg \
            assets/telegram-help.ogg
          codec="$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 assets/telegram-help.ogg)"
          format="$(ffprobe -v error -show_entries format=format_name -of csv=p=0 assets/telegram-help.ogg)"
          duration="$(ffprobe -v error -show_entries format=duration -of csv=p=0 assets/telegram-help.ogg)"
          test "$codec" = "opus"
          case "$format" in *ogg*) ;; *) echo "Expected OGG container, got $format"; exit 1;; esac
          echo "Verified output: codec=$codec format=$format duration=$duration"
          ls -lh assets/telegram-help.ogg

      - name: Create import branch with asset and source update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          branch="import/telegram-help-voice-${RUN_ID}"
          git switch -c "$branch"

          python - <<'PY'
          from pathlib import Path
          source = Path("src/telegram/voice-assets.ts")
          content = source.read_text()
          old = 'https://drive.google.com/uc?export=download&id=1T5seafoB-RB3AKebibhDQx1CA_VqAb7s'
          new = 'https://raw.githubusercontent.com/ashini-x/parmar-ai/main/assets/telegram-help.ogg'
          if old not in content:
              raise SystemExit("Expected Drive URL was not found in voice-assets.ts")
          source.write_text(content.replace(old, new))
          test = Path("test/telegram-voice-assets.test.ts")
          test_content = test.read_text()
          if old not in test_content:
              raise SystemExit("Expected Drive URL was not found in the voice asset test")
          test.write_text(test_content.replace(old, new))
          PY

          git rm .github/workflows/import-telegram-help-voice-once.yml
          git add assets/telegram-help.ogg src/telegram/voice-assets.ts test/telegram-voice-assets.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add Telegram help voice as OGG Opus asset"
          git push origin "HEAD:refs/heads/$branch"
          echo "IMPORT_BRANCH=$branch" >> "$GITHUB_STEP_SUMMARY"
          echo "Imported asset branch: $branch"
