name: M14 staging operator

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/brvin/m14-staging-worker.ts"
      - "src/ai/gemini.ts"
      - "src/brvin/m15-shadow-benchmark.ts"
      - "src/brvin/m15-benchmark-staging.ts"
      - "src/brvin/m15-v2-multisource.ts"
      - "src/brvin/m15-fatman-benchmark.ts"
      - "test/brvin-m15-fatman-benchmark.test.ts"
      - "test/brvin-m15-v2-multisource.test.ts"
      - "test/brvin-m15-benchmark-staging.test.ts"
      - "test/brvin-m15-shadow-benchmark.test.ts"
      - "src/brvin/m14-pilot-runner.ts"
      - "src/brvin/corpus-reader.ts"
      - "src/fatman/release-qa.ts"
      - "test/fatman-release-qa.test.ts"
      - "src/brvin/vertex-embedding.ts"
      - "src/brvin/qdrant-hybrid-pilot.ts"
      - "src/brvin/provider-contract.ts"
      - "src/brvin/retrieval.ts"
      - "src/brvin/service-core.ts"
      - "src/brvin/m15-v2-staging.ts"
      - "test/brvin-qdrant-provider-contract.test.ts"
      - "test/brvin-m14-staging-worker.test.ts"
      - "test/brvin-vertex-embedding.test.ts"
      - "test/brvin-qdrant-hybrid-pilot.test.ts"
      - "src/brvin/m14-vision-backfill.ts"
      - "src/brvin/corpus-store.ts"
      - "src/brvin/corpus.ts"
      - "src/fatman/import.ts"
      - "src/config/env.ts"
      - "wrangler.m14-staging.jsonc"
      - ".github/workflows/m14-staging-deploy.yml"
  push:
    branches:
      - main
    paths:
      - "src/brvin/m14-staging-worker.ts"
      - "src/ai/gemini.ts"
      - "src/brvin/m15-shadow-benchmark.ts"
      - "src/brvin/m15-fatman-benchmark.ts"
      - "test/brvin-m15-fatman-benchmark.test.ts"
      - "test/fatman-release-qa.test.ts"
      - "src/brvin/m15-benchmark-staging.ts"
      - "src/brvin/m15-v2-multisource.ts"
      - "test/brvin-m15-v2-multisource.test.ts"
      - "src/brvin/m14-pilot-runner.ts"
      - "src/brvin/corpus-reader.ts"
      - "src/fatman/release-qa.ts"
      - "src/brvin/vertex-embedding.ts"
      - "src/brvin/qdrant-hybrid-pilot.ts"
      - "src/brvin/provider-contract.ts"
      - "src/brvin/retrieval.ts"
      - "src/brvin/m15-v2-staging.ts"
      - "src/brvin/m14-vision-backfill.ts"
      - "src/brvin/corpus-store.ts"
      - "src/brvin/corpus.ts"
      - "src/fatman/import.ts"
      - "src/config/env.ts"
      - "wrangler.m14-staging.jsonc"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brvin-m14-staging-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate isolated M14 staging Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: npm run check
      - run: npx vitest run test/brvin-m14-staging-worker.test.ts test/brvin-m15-shadow-benchmark.test.ts test/brvin-m15-benchmark-staging.test.ts test/brvin-qdrant-provider-contract.test.ts test/brvin-m15-v2-staging.test.ts test/brvin-m15-v2-multisource.test.ts test/brvin-m15-fatman-benchmark.test.ts test/fatman-release-qa.test.ts
      - name: Verify versioned Vertex and Qdrant settings
        run: node scripts/verify-m14-staging-config.mjs
      - run: npx wrangler deploy --config wrangler.m14-staging.jsonc --dry-run

  deploy-staging:
    name: Deploy isolated M14 staging Worker
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Verify deployment credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::Missing CLOUDFLARE_API_TOKEN."; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID."; exit 1; }
      - name: Deploy the isolated staging operator only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.m14-staging.jsonc
