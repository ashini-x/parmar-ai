name: Release validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    # Documentation-only and workflow-policy updates must not redeploy
    # the existing production Workers. PRs still run full validation.
    paths:
      - "src/**"
      - "packages/**"
      - "scripts/**"
      - "test/**"
      - "wrangler*.jsonc"
      - "package.json"
      - "tsconfig.json"
      - "test/tsconfig.json"
      - "vitest*.config.ts"
      - "admin-script.js"
      - "migrations*.sql"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parmar-ai-${{ github.ref }}
  # New PR commits cancel stale PR checks, but do not cancel an in-progress production deployment.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: npm run check
      - run: npm test
      - run: npm run test:node
      - name: Validate private BRVIN service bundle without deploying
        run: npx wrangler deploy --config wrangler.brvin.jsonc --dry-run
      - name: Validate Parmar AI Worker bundle without deploying
        run: npx wrangler deploy --dry-run
      - name: Package source release
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p dist
          VERSION="$(node -p "require('./package.json').version")"
          git archive --format=zip --output="dist/parmar-ai-${VERSION}-production.zip" HEAD
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: parmar-ai-production-source
          path: dist/parmar-ai-*-production.zip
          if-no-files-found: error

  cloudflare-preflight:
    name: Verify Cloudflare credentials (no deployment)
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required secrets are available
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN."
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Missing CLOUDFLARE_ACCOUNT_ID. Add it as a repository secret or repository variable."
            exit 1
          fi
          echo "Both required Cloudflare settings are present."

      - name: Verify token can access the existing Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_code="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts?per_page=100")"
          HTTP_CODE="$http_code" RESPONSE_FILE="$response_file" node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const status = Number(process.env.HTTP_CODE);
          let body;
          try {
            body = JSON.parse(readFileSync(process.env.RESPONSE_FILE, 'utf8'));
          } catch {
            console.error(`Cloudflare returned an unreadable response (HTTP ${status}).`);
            process.exit(1);
          }
          if (status < 200 || status >= 300 || body.success !== true) {
            const errors = (body.errors ?? []).map((item) => `${item.code}: ${item.message}`).join('; ');
            console.error(`Cloudflare credential preflight failed (HTTP ${status}). ${errors}`);
            process.exit(1);
          }
          const requiredWorkers = ['parmar-ai', 'brvin-service'];
          const availableWorkers = new Set((body.result ?? []).map((script) => script.id));
          const missingWorkers = requiredWorkers.filter((worker) => !availableWorkers.has(worker));
          if (missingWorkers.length > 0) {
            console.error('Cloudflare API authentication succeeded, but required Workers are unavailable: ' + missingWorkers.join(', '));
            process.exit(1);
          }
          console.log('Cloudflare token authenticated and can list both production Workers.');
          console.log('No production deployment was attempted.');
          NODE

  production-acceptance:
    name: Verify live production without deploying
    if: github.event_name == 'workflow_dispatch'
    needs: cloudflare-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
      url: https://parmar-ai.thenewtongs.workers.dev
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify both live Workers and write deployment evidence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          SMOKE_TEST_URL: https://parmar-ai.thenewtongs.workers.dev/health
          SMOKE_TEST_ROOT_URL: https://parmar-ai.thenewtongs.workers.dev/
          SMOKE_TEST_ATTEMPTS: "12"
          SMOKE_TEST_DELAY_MS: "5000"
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          RELEASE_MANIFEST_PATH: dist/production-release-manifest.json
        run: node scripts/production-release-acceptance.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: parmar-ai-production-acceptance-${{ github.sha }}
          path: dist/production-release-manifest.json
          if-no-files-found: error

  production-scope:
    name: Determine whether production runtime changed
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.scope.outputs.deploy }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Classify the pushed file set
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base_sha="$BASE_SHA"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse "$GITHUB_SHA^")"
          fi
          deploy=false
          while IFS= read -r path; do
            case "$path" in
              # Explicit staging-only M14/M15 files. Changes outside this list
              # conservatively retain the normal production deployment path.
              docs/*|.github/workflows/release-validation.yml|src/brvin/m14-staging-worker.ts|src/brvin/m15-shadow-benchmark.ts|src/brvin/m14-physics-evaluation.ts|src/brvin/qdrant-hybrid-pilot.ts|src/brvin/vertex-embedding.ts|src/brvin/provider-contract.ts|src/config/env.ts|test/brvin-m14-staging-worker.test.ts|test/brvin-qdrant-hybrid-pilot.test.ts|test/brvin-m15-shadow-benchmark.test.ts|wrangler.m14-staging.jsonc|.github/workflows/m14-staging-deploy.yml)
                ;;
              *)
                deploy=true
                break
                ;;
            esac
          done < <(git diff --name-only "$base_sha" "$GITHUB_SHA")
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          if [[ "$deploy" == "true" ]]; then
            echo "Production runtime files changed; normal production deploy remains enabled."
          else
            echo "Staging/docs-only change set; skip production deploy while keeping full validation and staging deploy."
          fi

  deploy-production:
    name: Deploy and smoke-test production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.production-scope.outputs.deploy == 'true'
    needs: [validate, production-scope]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://parmar-ai.thenewtongs.workers.dev
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Capture both active Worker versions for rollback
        id: previous
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Cloudflare deployment credentials are missing."
            exit 1
          fi
          tmp_dir="$(mktemp -d)"
          for worker in brvin-service parmar-ai; do
            http_code="$(curl --silent --show-error \
              --output "$tmp_dir/$worker.json" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header 'Content-Type: application/json' \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/$worker/deployments")"
            if [[ "$http_code" -lt 200 || "$http_code" -ge 300 ]]; then
              echo "::error::Cannot read $worker deployment history (HTTP $http_code); refusing to deploy without rollback coverage."
              exit 1
            fi
          done
          TMP_DIR="$tmp_dir" node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          for (const worker of ['brvin-service', 'parmar-ai']) {
            const file = `${process.env.TMP_DIR}/${worker}.json`;
            let body;
            try {
              body = JSON.parse(readFileSync(file, 'utf8'));
            } catch {
              console.error(`Cannot parse ${worker} deployment history; refusing to deploy.`);
              process.exit(1);
            }
            if (body.success !== true) {
              const errors = (body.errors ?? []).map((item) => `${item.code}: ${item.message}`).join('; ');
              console.error(`Cannot read ${worker} deployment history. ${errors}`);
              process.exit(1);
            }
            const deployments = body.result?.deployments ?? [];
            const active = deployments.find((deployment) => {
              const versions = deployment.versions ?? [];
              return versions.length === 1 && versions[0]?.percentage === 100 && versions[0]?.version_id;
            });
            const versionId = active?.versions?.[0]?.version_id;
            if (!versionId) {
              console.error(`No single-version 100% deployment found for ${worker}; refusing to deploy.`);
              process.exit(1);
            }
            const outputName = worker === 'brvin-service' ? 'brvin_version_id' : 'parmar_version_id';
            appendFileSync(process.env.GITHUB_OUTPUT, `${outputName}=${versionId}\n`);
            console.log(`Captured rollback target for ${worker}.`);
          }
          NODE

      - name: Deploy private BRVIN retrieval service
        id: deploy_brvin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.brvin.jsonc

      - name: Deploy Parmar AI Worker
        id: deploy_parmar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

      - name: Verify root, BRVIN connectivity and Fatman source readiness
        id: smoke
        env:
          SMOKE_TEST_URL: https://parmar-ai.thenewtongs.workers.dev/health
          SMOKE_TEST_ROOT_URL: https://parmar-ai.thenewtongs.workers.dev/
          SMOKE_TEST_ATTEMPTS: "12"
          SMOKE_TEST_DELAY_MS: "5000"
        run: node scripts/production-smoke-test.mjs

      - name: Record live release acceptance and deployed Worker versions
        id: acceptance
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          SMOKE_TEST_URL: https://parmar-ai.thenewtongs.workers.dev/health
          SMOKE_TEST_ROOT_URL: https://parmar-ai.thenewtongs.workers.dev/
          SMOKE_TEST_ATTEMPTS: "3"
          SMOKE_TEST_DELAY_MS: "5000"
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          RELEASE_MANIFEST_PATH: dist/production-release-manifest.json
        run: node scripts/production-release-acceptance.mjs

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: parmar-ai-production-acceptance-${{ github.sha }}
          path: dist/production-release-manifest.json
          if-no-files-found: error

      - name: Roll back Parmar AI Worker if the release gate fails
        id: rollback_parmar
        if: ${{ failure() && steps.deploy_parmar.outcome == 'success' && (steps.smoke.outcome == 'failure' || steps.acceptance.outcome == 'failure') }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS_VERSION_ID: ${{ steps.previous.outputs.parmar_version_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PREVIOUS_VERSION_ID:-}" ]]; then
            echo "::error::Parmar AI rollback target is unavailable."
            exit 1
          fi
          npx wrangler rollback "${PREVIOUS_VERSION_ID}" --name parmar-ai --message "Automatic paired rollback after failed Phase 1 production verification"

      - name: Roll back BRVIN service if the release gate fails
        id: rollback_brvin
        if: ${{ failure() && steps.deploy_brvin.outcome == 'success' && (steps.deploy_parmar.outcome != 'success' || steps.smoke.outcome == 'failure' || steps.acceptance.outcome == 'failure') }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS_VERSION_ID: ${{ steps.previous.outputs.brvin_version_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PREVIOUS_VERSION_ID:-}" ]]; then
            echo "::error::BRVIN rollback target is unavailable."
            exit 1
          fi
          npx wrangler rollback "${PREVIOUS_VERSION_ID}" --name brvin-service --message "Automatic paired rollback after failed Phase 1 production verification"

      - name: Verify production health after rollback
        if: ${{ always() && (steps.rollback_parmar.outcome == 'success' || steps.rollback_brvin.outcome == 'success') }}
        env:
          SMOKE_TEST_URL: https://parmar-ai.thenewtongs.workers.dev/health
          SMOKE_TEST_ROOT_URL: https://parmar-ai.thenewtongs.workers.dev/
          SMOKE_TEST_ATTEMPTS: "6"
          SMOKE_TEST_DELAY_MS: "5000"
        run: node scripts/production-smoke-test.mjs
