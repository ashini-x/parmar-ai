name: Release validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    # Documentation-only and workflow-policy updates must not redeploy
    # the existing production Workers. PRs still run full validation.
    paths:
      - "src/**"
      - "packages/**"
      - "scripts/**"
      - "web/**"
      - ".github/workflows/release-validation.yml"
      - "wrangler.web.jsonc"
      - "test/**"
      - "wrangler*.jsonc"
      - "package.json"
      - "tsconfig.json"
      - "test/tsconfig.json"
      - "vitest*.config.ts"
      - "admin-script.js"
      - "migrations*.sql"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parmar-ai-${{ github.ref }}
  # New PR commits cancel stale PR checks, but do not cancel an in-progress production deployment.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: npm run check
      - run: npm test
      - run: npm run test:node
      - name: Validate private BRVIN service bundle without deploying
        run: npx wrangler deploy --config wrangler.brvin.jsonc --dry-run
      - name: Validate Parmar AI Worker bundle without deploying
        run: npx wrangler deploy --dry-run
      - name: Validate isolated BRɅIN website Worker without deploying
        run: npx wrangler deploy --config wrangler.web.jsonc --dry-run
      - name: Package source release
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p dist
          VERSION="$(node -p "require('./package.json').version")"
          git archive --format=zip --output="dist/parmar-ai-${VERSION}-production.zip" HEAD
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: parmar-ai-production-source
          path: dist/parmar-ai-*-production.zip
          if-no-files-found: error

  cloudflare-preflight:
    name: Verify Cloudflare credentials (no deployment)
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required secrets are available
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN."
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Missing CLOUDFLARE_ACCOUNT_ID. Add it as a repository secret or repository variable."
            exit 1
          fi
          echo "Both required Cloudflare settings are present."

      - name: Verify token can access the existing Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_code="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts?per_page=100")"
          HTTP_CODE="$http_code" RESPONSE_FILE="$response_file" node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const status = Number(process.env.HTTP_CODE);
          let body;
          try {
            body = JSON.parse(readFileSync(process.env.RESPONSE_FILE, 'utf8'));
          } catch {
            console.error(`Cloudflare returned an unreadable response (HTTP ${status}).`);
            process.exit(1);
          }
          if (status < 200 || status >= 300 || body.success !== true) {
            const errors = (body.errors ?? []).map((item) => `${item.code}: ${item.message}`).join('; ');
            console.error(`Cloudflare credential preflight failed (HTTP ${status}). ${errors}`);
            process.exit(1);
          }
          const requiredWorkers = ['parmar-ai', 'brvin-service'];
          const availableWorkers = new Set((body.result ?? []).map((script) => script.id));
          const missingWorkers = requiredWorkers.filter((worker) => !availableWorkers.has(worker));
          if (missingWorkers.length > 0) {
            console.error('Cloudflare API authentication succeeded, but required Workers are unavailable: ' + missingWorkers.join(', '));
            process.exit(1);
          }
          console.log('Cloudflare token authenticated and can list both production Workers.');
          console.log('No production deployment was attempted.');
          NODE

  production-acceptance:
    name: Verify live production without deploying
    if: github.event_name == 'workflow_dispatch'
    needs: cloudflare-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
      url: https://parmar-ai.thenewtongs.workers.dev
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify both live Workers and write deployment evidence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          SMOKE_TEST_URL: https://parmar-ai.thenewtongs.workers.dev/health
          SMOKE_TEST_ROOT_URL: https://parmar-ai.thenewtongs.workers.dev/
          SMOKE_TEST_ATTEMPTS: "12"
          SMOKE_TEST_DELAY_MS: "5000"
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          RELEASE_MANIFEST_PATH: dist/production-release-manifest.json
        run: node scripts/production-release-acceptance.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: parmar-ai-production-acceptance-${{ github.sha }}
          path: dist/production-release-manifest.json
          if-no-files-found: error

  production-scope:
    name: Determine whether production runtime changed
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.scope.outputs.deploy }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Classify the pushed file set
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base_sha="$BASE_SHA"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse "$GITHUB_SHA^")"
          fi
          deploy=false
          while IFS= read -r path; do
            case "$path" in
              # M14/M15 staging evaluator paths and unit-test-only files that do not
              # change a production-selected Worker bundle. The Qdrant provider adapter
              # is query-only and is selected only by the M15 staging override; the
              # production provider selector remains Cloudflare AI Search.
              # src/index.ts is also deliberately outside this list, so Telegram
              # stage instrumentation ships through the normal paired production
              # release and rollback gate after all validation passes.
              docs/*|web/*|wrangler.web.jsonc|.github/workflows/release-validation.yml|package.json|scripts/render-web-legal-dates.mjs|src/brvin/m14-staging-worker.ts|src/brvin/m15-shadow-benchmark.ts|src/brvin/m15-benchmark-staging.ts|src/brvin/m15-v2-multisource.ts|src/brvin/m15-v2-staging.ts|src/brvin/service-core.ts|src/brvin/retrieval.ts|src/brvin/provider-contract.ts|src/brvin/m14-physics-evaluation.ts|src/brvin/qdrant-hybrid-pilot.ts|src/brvin/vertex-embedding.ts|src/config/env.ts|scripts/verify-m14-staging-config.mjs|test/gemini-low-latency.test.ts|test/brvin-m14-staging-worker.test.ts|test/brvin-m15-v2-staging.test.ts|test/brvin-qdrant-provider-contract.test.ts|test/brvin-qdrant-hybrid-pilot.test.ts|test/brvin-v2-service.test.ts|test/brvin-m15-owner-waived-ai-passage-assessment.test.ts|test/fixtures/brvin-m15-owner-waived-ai-passage-assessment.json|test/brvin-m15-shadow-benchmark.test.ts|test/brvin-m15-benchmark-staging.test.ts|test/brvin-m15-v2-multisource.test.ts|wrangler.m14-staging.jsonc|.github/workflows/m14-staging-deploy.yml)
                ;;
              *)
                deploy=true
                break
                ;;
            esac
          done < <(git diff --name-only "$base_sha" "$GITHUB_SHA")
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          if [[ "$deploy" == "true" ]]; then
            echo "Production runtime files changed; normal production deploy remains enabled."
          else
            echo "Staging/docs-only change set; skip production deploy while keeping full validation and staging deploy."
          fi

  web-scope:
    name: Determine whether the standalone BRɅIN website changed
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.scope.outputs.deploy }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Classify the website file set
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base_sha="$BASE_SHA"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse "$GITHUB_SHA^")"
          fi
          deploy=false
          while IFS= read -r path; do
            case "$path" in
              web/*|wrangler.web.jsonc|package.json)
                deploy=true
                break
                ;;
            esac
          done < <(git diff --name-only "$base_sha" "$GITHUB_SHA")
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          if [[ "$deploy" == "true" ]]; then
            echo "Standalone website files changed; website deployment is enabled."
          else
            echo "No standalone website files changed; brvin-web deployment is skipped."
          fi

  deploy-web:
    name: Deploy isolated brvin-web Worker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.web-scope.outputs.deploy == 'true'
    needs: [validate, web-scope]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://brvin.in
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Verify isolated website deployment credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID."; exit 1; }
      - name: Deploy brvin-web only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:web
      - name: Verify navigation, legal pages, footer and 404 status
        shell: bash
        run: |
          set -euo pipefail
          home_file="$(mktemp)"
          privacy_file="$(mktemp)"
          terms_file="$(mktemp)"
          founder_file="$(mktemp)"
          why_file="$(mktemp)"
          not_found_file="$(mktemp)"
          trap 'rm -f "$home_file" "$privacy_file" "$terms_file" "$founder_file" "$why_file" "$not_found_file"' EXIT

          fetch_page() {
            local path="$1"
            local output="$2"
            local expected="$3"
            local passed=false
            for attempt in $(seq 1 24); do
              http_code="$(curl --silent --show-error --location --max-time 15 --output "$output" --write-out '%{http_code}' "https://brvin.in$path" || true)"
              if [[ "$http_code" == "200" ]] && grep -Fq "$expected" "$output"; then
                echo "Verified https://brvin.in$path"
                passed=true
                break
              fi
              sleep 5
            done
            if [[ "$passed" != "true" ]]; then
              echo "::error::https://brvin.in$path did not return the expected page."
              exit 1
            fi
          }

          fetch_page "/" "$home_file" "Answers with evidence."
          fetch_page "/why" "$why_file" "Why BRɅIN"
          fetch_page "/privacy" "$privacy_file" "Privacy Policy"
          fetch_page "/terms" "$terms_file" "Terms of Service"
          fetch_page "/founder" "$founder_file" "Ashini Gogoi"
          grep -Fq 'WORKED EXAMPLE / NOT A LIVE CUSTOMER RECORD' "$home_file" || { echo "::error::Homepage sample is not clearly labelled."; exit 1; }
          grep -Fq 'BROWSER SPEECH SYNTHESIS' "$home_file" || { echo "::error::Browser voice preview disclosure is missing."; exit 1; }
          grep -Fq 'The answer was only one part of the problem.' "$why_file" || { echo "::error::Why page origin story is missing."; exit 1; }
          grep -Fq 'The opportunity is in the layer between knowledge and applications.' "$why_file" || { echo "::error::Why page market thesis is missing."; exit 1; }
          grep -Fq 'One knowledge layer. Different learning experiences.' "$why_file" || { echo "::error::Why page product model is missing."; exit 1; }
          grep -Fq 'Start with learning. Earn the right to expand.' "$why_file" || { echo "::error::Why page growth path is missing."; exit 1; }
          grep -Fq 'BRɅIN Core is in production with Cloudflare AI Search.' "$why_file" || { echo "::error::Why page production status is missing."; exit 1; }
          grep -Fq 'Vertex AI embeddings with Qdrant Cloud remain a separate staging evaluation' "$why_file" || { echo "::error::Why page production/evaluation disclosure is missing."; exit 1; }
          story_sections="$(grep -oF 'class="story shell"' "$why_file" | wc -l | tr -d '[:space:]')"
          if [[ "$story_sections" != "3" ]]; then
            echo "::error::Why page should use three main narrative sections; found $story_sections."
            exit 1
          fi

          # Legal dates come from each policy file's latest Git change, rendered in India time.
          for legal_file in "$privacy_file" "$terms_file"; do
            grep -Eq 'Effective date: [0-9]{2} [A-Za-z]+ [0-9]{4} \(IST\)\.' "$legal_file" || {
              echo "::error::Legal effective date is missing or not rendered in IST."
              exit 1
            }
          done
          if grep -Fq '__BRVIN_LEGAL_EFFECTIVE_DATE__' "$privacy_file" "$terms_file"; then
            echo "::error::Unrendered legal date placeholder found."
            exit 1
          fi

          # Verify every homepage navigation target exists and its anchor scrolls smoothly.
          for expected in 'href="/why">Why BRɅIN</a>' 'href="#platform"' 'href="#demo"' 'href="#plans"' 'href="/founder">Founder</a>' 'href="/privacy"' 'href="mailto:partners@brvin.in"'; do
            grep -Fq "$expected" "$home_file" || { echo "::error::Homepage navigation target missing: $expected"; exit 1; }
          done
          for expected in 'id="platform"' 'id="demo"' 'id="plans"'; do
            grep -Fq "$expected" "$home_file" || { echo "::error::Homepage section target missing: $expected"; exit 1; }
          done
          grep -Fq 'scroll-behavior:smooth' "$home_file" || { echo "::error::Smooth scrolling is not enabled."; exit 1; }
          for page_file in "$home_file" "$why_file" "$privacy_file" "$terms_file" "$founder_file"; do
            nav_count="$(grep -oF 'href="/founder">Founder</a>' "$page_file" | wc -l | tr -d '[:space:]')"
            if [[ "$nav_count" != "1" ]]; then
              echo "::error::Expected exactly one Founder navigation link; found $nav_count."
              exit 1
            fi
            why_nav_count="$(grep -oF 'href="/why">Why BRɅIN</a>' "$page_file" | wc -l | tr -d '[:space:]')"
            if [[ "$why_nav_count" != "1" ]]; then
              echo "::error::Expected exactly one Why BRɅIN navigation link; found $why_nav_count."
              exit 1
            fi
          done
          grep -Fq 'I’m the founder of BRɅIN' "$founder_file" || { echo "::error::Founder role missing."; exit 1; }
          grep -Fq 'Why I started BRɅIN' "$founder_file" || { echo "::error::Founder origin story is missing."; exit 1; }
          grep -Fq "The gap I'm working on" "$founder_file" || { echo "::error::Founder market thesis is missing."; exit 1; }
          grep -Fq 'mailto:founder@brvin.in' "$founder_file" || { echo "::error::Founder contact missing."; exit 1; }
          grep -Fq 'https://github.com/ashini-x/parmar-ai' "$founder_file" || { echo "::error::Core repository link missing."; exit 1; }
          grep -Fq 'https://github.com/ashini-x/brvin-teachers' "$founder_file" || { echo "::error::Teachers repository link missing."; exit 1; }
          for page_file in "$privacy_file" "$terms_file"; do
            grep -Fq 'mailto:founder@brvin.in' "$page_file" || { echo "::error::Founder legal contact missing."; exit 1; }
          done

          # Verify the legal documents contain their substantive sections, not just a title shell.
          for expected in 'Information processed' 'Voice and audio data' 'Retention and deletion' 'Privacy questions'; do
            grep -Fq "$expected" "$privacy_file" || { echo "::error::Privacy page is missing: $expected"; exit 1; }
          done
          for expected in '18+ access only' 'Scope of the service' 'Acceptable use' 'Governing law'; do
            grep -Fq "$expected" "$terms_file" || { echo "::error::Terms page is missing: $expected"; exit 1; }
          done

          # Verify the footer label, exact Business mailto, policy links and unchanged age notice.
          check_footer() {
            local page_file="$1"
            for expected in \
              'Voice AI powered by ElevenLabs (Integration in development)' \
              'href="mailto:partners@brvin.in" rel="noopener noreferrer">Business</a>' \
              'href="/privacy">Privacy</a>' \
              'href="/terms">Terms</a>' \
              'BRɅIN platforms and voice interfaces are designed exclusively for adult professionals, researchers, and enterprise users aged 18 and older.'; do
              grep -Fq "$expected" "$page_file" || { echo "::error::Footer check failed: $expected"; exit 1; }
            done
          }
          check_footer "$home_file"
          check_footer "$why_file"
          check_footer "$privacy_file"
          check_footer "$terms_file"
          check_footer "$founder_file"

          # Unknown routes must return the custom page with an actual HTTP 404.
          unknown_path="/__brvin_not_found_check_${GITHUB_SHA}__"
          http_code="$(curl --silent --show-error --max-time 20 --output "$not_found_file" --write-out '%{http_code}' "https://brvin.in$unknown_path" || true)"
          if [[ "$http_code" != "404" ]]; then
            echo "::error::Unknown route returned HTTP $http_code instead of HTTP 404."
            exit 1
          fi
          for expected in \
            '404 • UNVERIFIED ROUTE' \
            'This page could not be found.' \
            'The route you requested does not exist in our index or has been moved.' \
            'href="/why">Why BRɅIN</a>' \
            'href="/#platform"' \
            'href="/founder">Founder</a>' \
            'href="https://telegram.me/parmarthbot" target="_blank" rel="noopener noreferrer"' \
            'href="mailto:partners@brvin.in"'; do
            grep -Fq "$expected" "$not_found_file" || { echo "::error::Custom 404 page is missing: $expected"; exit 1; }
          done
          check_footer "$not_found_file"
          nav_count="$(grep -oF 'href="/founder">Founder</a>' "$not_found_file" | wc -l | tr -d '[:space:]')"
          if [[ "$nav_count" != "1" ]]; then
            echo "::error::Expected exactly one Founder link on the 404 page; found $nav_count."
            exit 1
          fi
          echo "Verified navigation anchors, founder page, legal pages, footer links and custom HTTP 404 response."


  deploy-production:
    name: Deploy and smoke-test production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.production-scope.outputs.deploy == 'true'
    needs: [validate, production-scope]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://parmar-ai.thenewtongs.workers.dev
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Capture both active Worker versions for rollback
        id: previous
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Cloudflare deployment credentials are missing."
            exit 1
          fi
          tmp_dir="$(mktemp -d)"
          for worker in brvin-service parmar-ai; do
            http_code="$(curl --silent --show-error \
              --output "$tmp_dir/$worker.json" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header 'Content-Type: application/json' \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/$worker/deployments")"
            if [[ "$http_code" -lt 200 || "$http_code" -ge 300 ]]; then
              echo "::error::Cannot read $worker deployment history (HTTP $http_code); refusing to deploy without rollback coverage."
              exit 1
            fi
          done
          TMP_DIR="$tmp_dir" node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          for (const worker of ['brvin-service', 'parmar-ai']) {
            const file = `${process.env.TMP_DIR}/${worker}.json`;
            let body;
            try {
              body = JSON.parse(readFileSync(file, 'utf8'));
            } catch {
              console.error(`Cannot parse ${worker} deployment history; refusing to deploy.`);
              process.exit(1);
            }
            if (body.success !== true) {
              const errors = (body.errors ?? []).map((item) => `${item.code}: ${item.message}`).join('; ');
              console.error(`Cannot read ${worker} deployment history. ${errors}`);
              process.exit(1);
            }
            const deployments = body.result?.deployments ?? [];
            const active = deployments.find((deployment) => {
              const versions = deployment.versions ?? [];
              return versions.length === 1 && versions[0]?.percentage === 100 && versions[0]?.version_id;
            });
            const versionId = active?.versions?.[0]?.version_id;
            if (!versionId) {
              console.error(`No single-version 100% deployment found for ${worker}; refusing to deploy.`);
              process.exit(1);
            }
            const outputName = worker === 'brvin-service' ? 'brvin_version_id' : 'parmar_version_id';
            appendFileSync(process.env.GITHUB_OUTPUT, `${outputName}=${versionId}\n`);
            console.log(`Captured rollback target for ${worker}.`);
          }
          NODE

      - name: Deploy private BRVIN retrieval service
        id: deploy_brvin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.brvin.jsonc

      - name: Deploy Parmar AI Worker
        id: deploy_parmar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

      - name: Verify root, BRVIN connectivity and Fatman source readiness
        id: smoke
        env:
          SMOKE_TEST_URL: https://parmar-ai.thenewtongs.workers.dev/health
          SMOKE_TEST_ROOT_URL: https://parmar-ai.thenewtongs.workers.dev/
          SMOKE_TEST_ATTEMPTS: "12"
          SMOKE_TEST_DELAY_MS: "5000"
        run: node scripts/production-smoke-test.mjs

      - name: Record live release acceptance and deployed Worker versions
        id: acceptance
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          SMOKE_TEST_URL: https://parmar-ai.thenewtongs.workers.dev/health
          SMOKE_TEST_ROOT_URL: https://parmar-ai.thenewtongs.workers.dev/
          SMOKE_TEST_ATTEMPTS: "3"
          SMOKE_TEST_DELAY_MS: "5000"
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          RELEASE_MANIFEST_PATH: dist/production-release-manifest.json
        run: node scripts/production-release-acceptance.mjs

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: parmar-ai-production-acceptance-${{ github.sha }}
          path: dist/production-release-manifest.json
          if-no-files-found: error

      - name: Roll back Parmar AI Worker if the release gate fails
        id: rollback_parmar
        if: ${{ failure() && steps.deploy_parmar.outcome == 'success' && (steps.smoke.outcome == 'failure' || steps.acceptance.outcome == 'failure') }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS_VERSION_ID: ${{ steps.previous.outputs.parmar_version_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PREVIOUS_VERSION_ID:-}" ]]; then
            echo "::error::Parmar AI rollback target is unavailable."
            exit 1
          fi
          npx wrangler rollback "${PREVIOUS_VERSION_ID}" --name parmar-ai --message "Automatic paired rollback after failed Phase 1 production verification"

      - name: Roll back BRVIN service if the release gate fails
        id: rollback_brvin
        if: ${{ failure() && steps.deploy_brvin.outcome == 'success' && (steps.deploy_parmar.outcome != 'success' || steps.smoke.outcome == 'failure' || steps.acceptance.outcome == 'failure') }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS_VERSION_ID: ${{ steps.previous.outputs.brvin_version_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PREVIOUS_VERSION_ID:-}" ]]; then
            echo "::error::BRVIN rollback target is unavailable."
            exit 1
          fi
          npx wrangler rollback "${PREVIOUS_VERSION_ID}" --name brvin-service --message "Automatic paired rollback after failed Phase 1 production verification"

      - name: Verify production health after rollback
        if: ${{ always() && (steps.rollback_parmar.outcome == 'success' || steps.rollback_brvin.outcome == 'success') }}
        env:
          SMOKE_TEST_URL: https://parmar-ai.thenewtongs.workers.dev/health
          SMOKE_TEST_ROOT_URL: https://parmar-ai.thenewtongs.workers.dev/
          SMOKE_TEST_ATTEMPTS: "6"
          SMOKE_TEST_DELAY_MS: "5000"
        run: node scripts/production-smoke-test.mjs
