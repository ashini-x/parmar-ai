name: VRAIN Worker Verification

on:
  pull_request:
    paths:
      - "workers/vrain/**"
      - "docs/VRAIN_*.md"
      - "package.json"
      - ".github/workflows/vrain-worker.yml"
  push:
    branches:
      - main
    paths:
      - "workers/vrain/**"
      - "docs/VRAIN_*.md"
      - "package.json"
      - ".github/workflows/vrain-worker.yml"

permissions:
  contents: read

concurrency:
  group: vrain-worker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check standalone VRAIN Worker
        run: npm run check:vrain

      - name: Run VRAIN unit tests
        run: npm run test:vrain

      - name: Validate Wrangler configuration and bundle
        run: npm run dry-run:vrain
